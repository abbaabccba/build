name: Build Orange Pi Armbian

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        board:
          - orangepizero
          - orangepi-r1

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Build
        run: |
          ./compile.sh \
            BOARD="${{ matrix.board }}" \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_ONLY=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=xz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ matrix.board }}
          path: output/images/*
          if-no-files-found: error
